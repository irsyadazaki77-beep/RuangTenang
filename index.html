<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>RuangTenang - Konseling Mental & RuangKerja Mahasiswa</title>
    <meta name="description" content="Ekosistem ganda mahasiswa: Mode RuangTenang untuk kesehatan mental & relaksasi, dan Mode RuangKerja untuk asisten akademik dengan Live Interactive Artifact Canvas." />
    <meta property="og:title" content="RuangTenang - Konseling Mental & RuangKerja Mahasiswa" />
    <meta property="og:description" content="Ekosistem ganda mahasiswa: Mode RuangTenang untuk kesehatan mental & relaksasi, dan Mode RuangKerja untuk asisten akademik dengan Live Interactive Artifact Canvas." />
    <meta name="theme-color" content="#080d14" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RuangTenang" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap" />
    <script>
      (function() {
        function logError(payload) {
          try {
            var msg = String(payload.message || '').toLowerCase();
            var stack = String(payload.stack || '').toLowerCase();
            var src = String(payload.source || '').toLowerCase();
            if (
              msg.indexOf('websocket') !== -1 ||
              stack.indexOf('websocket') !== -1 ||
              msg.indexOf('hmr') !== -1 ||
              stack.indexOf('vite/client') !== -1 ||
              src.indexOf('vite/client') !== -1 ||
              msg.indexOf('socket') !== -1
            ) {
              return;
            }
            fetch('/api/v1/client-debug', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              keepalive: true
            }).catch(function(){});
          } catch(e) {}
        }
        window.onerror = function(message, source, lineno, colno, error) {
          logError({
            type: 'onerror',
            message: message,
            source: source,
            lineno: lineno,
            colno: colno,
            stack: error ? error.stack : null,
            href: window.location.href
          });
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          logError({
            type: 'unhandledrejection',
            message: reason ? (reason.message || String(reason)) : 'Unknown rejection',
            stack: reason && reason.stack ? reason.stack : null,
            href: window.location.href
          });
        });
      })();
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ruangtenang_theme');
          var isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
          }).catch(function(e){});
        }
      } catch(e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
