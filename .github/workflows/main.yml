name: CI/CD Pipeline & Production Quality Gate
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: test
  JWT_SECRET: "ci-only-jwt-signing-key-not-for-production-32chars"
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
  BLIND_INDEX_SECRET: "ci-only-blind-index-key-not-for-production-32chars"
  DATABASE_URL: "file:./prisma/ruangtenang_sqlite.db"
jobs:
  static_checks:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push:sqlite
      - name: Type Checking
        run: npm run typecheck
      - name: Linter
        run: npm run lint

  unit_tests:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push:sqlite
      - name: Unit Tests (native Vitest shard)
        # Worker crash / OOM fails this step. Frontend (jsdom) and backend (node) projects
        # are discovered by glob, so new test files are sharded automatically.
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run test:unit -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=junit --outputFile.junit=reports/unit-shard-${{ matrix.shard }}.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit-${{ matrix.shard }}
          path: reports/*.xml
          retention-days: 7
          if-no-files-found: ignore

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push:sqlite
      - run: npm run test:integration

  security_tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push:sqlite
      - run: npm run test:security

  build_and_e2e:
    name: Build, Bundle Budget & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run db:push:sqlite
      - name: Build Application
        run: npm run build:production
      - name: Performance Budget Check
        run: node scripts/check_bundle_size.cjs
      - name: True E2E Playwright Tests
        run: npm run test:e2e

  postgres_migration_rehearsal:
    name: PostgreSQL Migration & Upgrade Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ruangtenang
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: ruangtenang_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: "postgresql://ruangtenang:ci-only-postgres-password@localhost:5432/ruangtenang_ci?schema=public"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Generate PostgreSQL Prisma Client
        run: DATABASE_URL=$POSTGRES_URL npx prisma generate --schema prisma/schema.postgres.prisma
      - name: Fresh & Legacy Migration Rehearsal
        run: POSTGRES_ADMIN_URL=$POSTGRES_URL npm run db:rehearse:postgres
      - name: Deploy CI PostgreSQL Database
        run: DATABASE_URL=$POSTGRES_URL npx prisma migrate deploy --schema prisma/schema.postgres.prisma
      - name: PostgreSQL Integration Tests
        run: DATABASE_URL=$POSTGRES_URL npm run test:integration
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Rehearse encrypted backup and isolated restore
        env:
          DATABASE_URL: ${{ env.POSTGRES_URL }}
          BACKUP_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RESTORE_REHEARSAL_ALLOW_TARGET: isolated
        run: npm run db:backup:rehearse

  supply_chain_security:
    name: Dependency, Secret & Container Scans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Scan npm dependencies
        run: npm audit --audit-level=high
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production image
        run: docker build --pull --tag ruangtenang:${{ github.sha }} .
      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ruangtenang:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  quality_gate:
    name: Code Quality, Tests & Build Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [static_checks, unit_tests, integration_tests, security_tests, build_and_e2e, postgres_migration_rehearsal, supply_chain_security]
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Gate results: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then
            echo "One or more required gates did not pass"; exit 1
          fi
