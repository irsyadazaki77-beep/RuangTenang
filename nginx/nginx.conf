# ==============================================================================
# Hardened Nginx Global Configuration for RuangTenang & RuangKerja Platform
# Optimization: Event loop epoll, multi-threaded worker auto, Gzip compression
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version and OS signatures for defense-in-depth
    server_tokens off;

    # Performance I/O optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # --------------------------------------------------------------------------
    # Privacy-Preserving Structured Access Logging
    # --------------------------------------------------------------------------
    log_format privacy_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"'
    '}';

    access_log /var/log/nginx/access.log privacy_json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Gzip Compression Configuration
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # Rate Limiting Zones (DDoS & Brute Force Mitigation)
    # --------------------------------------------------------------------------
    # 1. Auth zone: 5 requests per second per IP for login/register/MFA
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # 2. Emergency SOS zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=emergency_limit:10m rate=10r/s;

    # 3. General API zone: 30 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

    # Return standard HTTP 429 Too Many Requests when rate limit exceeded
    limit_req_status 429;

    # --------------------------------------------------------------------------
    # Upstream Backend Pool (RuangTenang Node.js App)
    # --------------------------------------------------------------------------
    upstream app_upstream {
        server web:3000;
        keepalive 32;
    }

    # Include modular virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
