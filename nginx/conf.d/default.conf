# ==============================================================================
# Hardened Virtual Host Configuration for RuangTenang & RuangKerja
# Protocols: HTTP (80) -> HTTPS (443) with Let's Encrypt / Custom TLS
# Security: HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Rate Limiting
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80: ACME Challenge & Automatic HTTPS Redirection)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all plain HTTP traffic to secure HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443: Hardened TLS & Reverse Proxy)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --------------------------------------------------------------------------
    # SSL / TLS Certificate Configuration
    # Note: If custom domain certificates are provisioned via Certbot, point to /etc/letsencrypt/live/<domain>/
    # Fallback paths for initial self-signed or pre-provisioned certificates
    # --------------------------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern TLS Protocol Hardening (Disable SSLv3, TLSv1.0, TLSv1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Caching & Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (Enabled if valid certificates and resolvers are present)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 1.1.1.1 valid=300s;
    # resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # HTTP Hardened Security Headers
    # --------------------------------------------------------------------------
    # HTTP Strict Transport Security (HSTS): Enforce HTTPS for 1 year + subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Clickjacking Protection: Disallow embedding in foreign iframes
    add_header X-Frame-Options "DENY" always;

    # MIME-Type Sniffing Protection
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy: Send full URL for same-origin, domain-only for cross-origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Legacy XSS Filter protection for older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Restrict unnecessary hardware sensors in sensitive mental health context
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;

    # Content Security Policy (CSP) Hardening
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://api.dicebear.com https://*.google.com https://*.googleapis.com https://*.googleusercontent.com https://*.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # --------------------------------------------------------------------------
    # Proxy Headers Configuration Template
    # --------------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # --------------------------------------------------------------------------
    # Rate Limited Location: Authentication & MFA Endpoints
    # --------------------------------------------------------------------------
    location ~* ^/api/(v1/)?auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # --------------------------------------------------------------------------
    # Rate Limited Location: Emergency & SOS Dispatch Endpoints
    # --------------------------------------------------------------------------
    location ~* ^/api/(v1/)?emergency/ {
        limit_req zone=emergency_limit burst=20 nodelay;
        
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # Rate Limited Location: General API Routes
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;
        
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # WebSocket & Server-Sent Events (SSE) Streaming Support
    # --------------------------------------------------------------------------
    location ~* ^/(ws|api/v1/stream|api/stream|socket\.io)/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Extended timeouts for persistent bidirectional communication
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite build assets: JS, CSS, Web Fonts, Images)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Cache static immutable chunks for 1 year in client/CDN browser cache
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Re-apply security headers for static responses
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --------------------------------------------------------------------------
    # Root Application & Single Page Application (SPA) Fallback
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
